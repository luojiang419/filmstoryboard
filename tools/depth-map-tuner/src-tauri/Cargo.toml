[package]
name = "shiyin-depth-map-tuner"
version = "0.1.0"
description = "filmstoryboard depth-map tuning plugin"
authors = ["filmstoryboard contributors"]
edition = "2021"

[[bin]]
name = "SHIYIN-Depth-Tuner"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
base64 = "0.22.1"
rfd = { version = "0.15.4", features = ["common-controls-v6"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
